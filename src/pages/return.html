<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marcelinium Inc - Return</title>
</head>
<body>
    <div id="navbar"></div>

    <div class="return">
        <div class="inputs">
            <div class="item">
                <label for="email" class="laemail">Enter email:</label>
                <input name="email" type="email" class="inemail" placeholder="JohnSmith@gmail.com" required>
            </div>
            <div class="item">
                <label for="pass" class="lapass">Enter password:</label>
                <input name="pass" type="password" class="inpass" placeholder="JohnSmith123" required>
            </div>
        </div>

        <button class="submit" type="submit">Log in</button>

        <div class="join"><a href="/src/pages/join.html">Need an account</a></div>
    </div>

    <div id="bottombar"></div>

    <!-- CSS -->
    <link rel="stylesheet" href="/src/styles/return.css">

    <!-- JS -->
    <script src="/src/scripts/components.js"></script>
    <script src="/src/assests/lib/jquery.js"></script>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bitcount+Prop+Single:wght@100..900&family=Oswald:wght@200..700&display=swap" rel="stylesheet">
</body>
</html>
